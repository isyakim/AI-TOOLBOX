name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - name: Verify build output
        run: test -f out/main/index.js && test -f out/preload/index.js && test -f out/renderer/index.html

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run --auto-servernum npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Audit production dependencies
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --registry=https://registry.npmjs.org --audit-level=high --json > audit.json 2>audit-error.log
          status=$?
          if grep -q '"metadata"' audit.json; then
            cat audit.json
            exit $status
          fi
          echo "::warning::npm audit unavailable"
          cat audit-error.log
      - name: Report development dependency findings
        continue-on-error: true
        run: npm audit --registry=https://registry.npmjs.org --audit-level=high
      - run: npm run license:check
